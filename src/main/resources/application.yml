server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cstad-devops-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-service}:${DB_PORT:5432}/${DB_NAME:cstad_devops}
    username: ${DB_USERNAME:cstad_user}
    password: ${DB_PASSWORD:cstad_secret_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  environment: ${APP_ENV:production}

